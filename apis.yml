aid: lumotive
name: Lumotive
description: 'Lumotive is a Seattle-based semiconductor company building programmable optics on its patented
  Light Control Metasurface (LCM) technology — solid-state, software-defined beam steering implemented
  in a standard CMOS process with no moving parts. Its products include the LM10 and LX10 LCM beam-steering
  chips, the LCM Evaluation Kit (LEK), the M30 iToF and NM120 3D-sensing development kits, and the M30/TX10
  reference designs, applied to industrial automation, intelligent traffic systems, automotive ADAS and
  autonomy, defense, and optical circuit switching for AI data centers. Lumotive publishes an "Open Lidar
  API" — a real-time control interface for software-defined Lidar 2.0 hardware covering region-of-interest
  scanning, frame rate, resolution and range, plus a common point-cloud format — and ships C/C++ LCM control
  libraries with Python bindings alongside its evaluation kits. That interface is an embedded hardware-control
  API, not a public web API: no developer portal, documentation site, machine-readable specification,
  or self-service sign-up is published, and access is granted to selected partners through the Technology
  Access Program by contacting the company.'
